# ================================================================
# mmckb —— 系统开关 (testtt 两轮受控采样复核)
# ================================================================
# 复核证据(2805 个 S12 速度包, 相邻打击间隔直方图):
#   第一轮: 间隔 <480ms 的样本 0/803,  p01=503ms  众数桶 500~599ms (350/803)
#   第二轮: 间隔 <480ms 的样本 6/2000 (其中 2 个为同时刻重复), p01=496ms 众数桶 500~599ms (1536/2000)
#   ⇒ 最短可再次命中间隔 = 10 tick(500ms) = 原版 20 tick 无敌帧的一半
#   ⇒ hit-delay: 20 (maxNoDamageTicks=20, 受伤计时 <= 10 tick 时才可再次结算)
#   ⇒ iframe-knockback: 必须 false —— 窗口内被抑制的攻击不产生任何击退包,
#      若开启会让受害者每下点击都吃击退(漂浮/连续起飞), 与 MMC 手感完全不符
# ================================================================
stop-sprint: true
damage-increment: true
iframe-knockback: false
server-side-kb: false
hit-delay: 20
lag-compensation:
  enabled: false
