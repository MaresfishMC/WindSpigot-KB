# ================================================================
# mmckb —— 高级机制 (testtt 两轮受控采样复核)
# ================================================================
# 疾跑加成防相消 (2026-09-12 端内实测新增)
# ------------------------------------------------------------------
# 问题: 疾跑/附魔加成按"攻击者朝向"施加, 基础击退按"攻击者→受击者"方向施加。
#   端内实测 599 个发包样本发现, 当两者夹角 >90° 时会互相抵消:
#     夹角 120° → |速度包| 0.483   夹角 150° → 0.266   夹角 180° → 0.106
#   26 个夹角>90° 的样本里 3 个掉到 0.10~0.19 —— 打中了却几乎不击退 ("nokb")。
# 开启后: 只保留不与基础击退反向的分量, 保证命中击退不低于基础值;
#   夹角 <90° 时行为完全不变(标定值 0.527375/0.948875/0.886775/0.9494 不受影响)。
# 注: MMC 原版同样存在相消(其 87 个>90°样本中 25 个低于 0.45), 开启本项是"改善手感"
#     而非"还原 MMC"; 若要严格贴 MMC 行为, 改回 false 即可。
# ------------------------------------------------------------------
sprint-bonus:
  no-cancel: true

# 疾跑宽限: 攻击方疾跑加成已标定为 +0.4215 (占总量 45%), 判定必须尽量精确,
#   故将宽限窗口设为 0 并关闭附加攻击距离(MMC 不额外放宽 reach)。
#   若需要"客户端显示疾跑但服务端已取消"的容错, 可改 enabled: true / grace-ticks: 5,
#   代价是可能对非疾跑命中错误地加上 0.4215。
sprint-reach:
  enabled: false
  grace-ticks: 0
  extra: 0.0
  feedback: false

# 防飞天限高: 实测垂直在 2783/2805 个样本恒为 0.361375(与高度差无关),
#   开启会在跳击/高低差时把垂直压到 0.1, 与 MMC 完全不符 ⇒ 关闭
y-limit:
  enabled: false
  max-y-height: 1.25
  vertical-kb-after-limit: 0.1

# 距离衰减: 受控段(第二轮 idx1300+, 全程不疾跑)在距离 1.06~4.03 格内 |out| 恒为 0.5274,
#   无任何衰减趋势; 早期看到的"远距离变小"是受击方运动方向/疾跑状态混淆 ⇒ 关闭
range-reduction:
  enabled: false
  start-range: 3.0
  factor: 0.035
  max-reduction: 0.4

# 连击递增: 受控段内基础击退恒定；间隔 505ms 的连击样本与孤立样本同为 0.527375 ⇒ 关闭
#   (注: 实测"连击"表现为 505ms 节奏, 由 hit-delay=20 解释, 不需要 combo 机制)
combo:
  enabled: false
  increment: 0.05
  max: 0.4
  reset-ticks: 40

# 重力/阻力: 原版(速度包 Y 恒等于上限, 无自定义重力痕迹)
gravity:
  value: 0.08
  air-resistance: 0.98
air-ground:
  grace-ticks: 1

# 动态 misplay: 实测未检出 ping 补偿(受击方/攻击方 ping 在采样中几乎不变) ⇒ 关闭
dynamic-misplay:
  enabled: false
  target: 0.0
  compensation: 0.5
  max-compensation: 0.3
  anti-cheat-compatible: true
